status: primary_and_pooled_cohorts_frozen_v1

primary_24h:
  drug: trametinib
  time_hours: 24
  control_source: DMSO_24hr_expt3
  treated_source: Trametinib_24hr_expt3
  min_cells_per_condition: 20
  required_conditions:
    - control
    - trametinib

reproduction_sensitivity:
  description: reproduce the authors' pooled-control cohort
  control_sources:
    - DMSO_6hr_expt3
    - DMSO_24hr_expt3
  treated_source: Trametinib_24hr_expt3
  min_cells_per_condition: 20
  use_for_primary_claim: false

sensitivity_thresholds:
  - 10
  - 20
  - 30

normalization:
  aggregation: sum_raw_umi_by_cell_line_and_condition
  method: log1p_cpm
  scale_factor: 1000000

descriptive_control_time_qc:
  min_total_control_counts: 100
  min_expressing_lines_per_time: 10
  use_for_model_feature_selection: false
  interpretation: time_and_source_difference_not_causal_time_effect

timecourse:
  protocol_version: "1.0"
  source: data/mcfarland_2020.h5ad
  condition_source: hash_tag
  cell_line_source: singlet_ID
  depmap_id_source: DepMap_ID
  quality_filter:
    column: cell_quality
    value: normal
  expected_hours:
    - 3
    - 6
    - 12
    - 24
    - 48
  min_cells_per_condition: 10
  sensitivity_thresholds: [10, 20, 30]
  primary_control: time_matched_DMSO
  untreated_48h_use: control_QC_only
  pool_controls_only_after_time_effect_check: true
  primary_analysis_unit: cell_line
  pca_variable_genes: 5000
  transfer_training_cohort: strict_94_24h
  transfer_test_rule: DepMap_ID_not_in_training_cohort
  transfer_models: [B1, B4_FIXED_D20_A100, CCLR_FIXED_D20_R20_A100]
