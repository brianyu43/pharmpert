baselines:
  - id: B0
    name: no_change
  - id: B1
    name: global_mean
  - id: B2
    name: lineage_mean
    fallback: B1
  - id: B3
    name: nearest_neighbor
  - id: B4
    name: direct_ridge

baseline_protocol:
  lineage_mean_min_train_lines: 2
  feature_selection:
    fit_on: outer_or_inner_training_control_only
    min_mean_log1p_cpm: 0.1
    max_variable_genes: 5000
  control_pca_dimensions: [5, 10, 20, 30]
  control_pca_whiten: true
  nearest_neighbor_metric: euclidean_whitened_control_pc
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
  selection_metric: cell_line_macro_rmse_delta
  target_genes: all_32738
  top_k: 50
  bootstrap_replicates: 2000
  sensitivity_as_predictor: false
  mutations_as_predictor: false

main_model:
  id: CCLR
  name: context_conditioned_low_rank_response
  feature_selection: same_as_baseline_training_control_only
  control_pca_dimensions: [5, 10, 20, 30]
  control_pca_whiten: true
  response_ranks: [2, 5, 10, 20]
  response_pca_whiten: false
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
  selection_metric: cell_line_macro_rmse_delta
  tie_break: lower_response_rank_then_lower_control_dimension_then_higher_alpha
  target_genes: all_32738
  top_k: 50
  bootstrap_replicates: 2000
  sensitivity_as_predictor: false
  mutations_as_predictor: false

w7_ablation:
  protocol_version: "1.2"
  mode: diagnostic_fixed_outer_fold_evaluation
  primary_reference: B4_DIRECT_RIDGE_W5
  fixed_reference:
    control_dimension: 20
    response_rank: 20
    ridge_alpha: 100.0
  control_dimensions: [5, 10, 20, 30]
  response_ranks: [2, 5, 10, 20, 30, 40, 50]
  response_rank_extension:
    status: post_w6_diagnostic_only
    reason: W6 selected the preregistered upper boundary rank 20 in every outer fold
    changes_w6_primary_result: false
  feature_variants:
    - full_filtered_genes
    - predefined_pathway_panel
    - full_filtered_genes_plus_training_fitted_lineage
    - full_filtered_genes_plus_training_fitted_braf_kras
  pathway_panel:
    config: config/genesets.yaml
    selector: dataset_symbol_intersection_then_outer_training_expression_filter
    target_genes: all_32738
  metadata_features:
    lineage:
      encoding: outer_training_fitted_one_hot_drop_first_false
      unknown_test_category: all_zero
    braf_kras:
      encoding: outer_training_fitted_center_and_scale
      columns: [braf_mut, kras_mut]
      constant_training_columns: drop
  comparisons:
    - B1_MEAN_W5
    - B4_DIRECT_RIDGE_W5
    - CCLR_NESTED_W6
    - FIXED_FULL_D20_R20
    - CONTROL_D05_R20
    - CONTROL_D10_R20
    - CONTROL_D30_R20
    - RANK_D20_R02
    - RANK_D20_R05
    - RANK_D20_R10
    - RANK_D20_R30
    - RANK_D20_R40
    - RANK_D20_R50
    - PATHWAY_D20_R20
    - LINEAGE_D20_R20
    - BRAF_KRAS_D20_R20
  selection_rule: report_all_fixed_variants_without_outer_test_selection
  bootstrap_replicates: 2000
  bootstrap_seed: 20260827
  sensitivity_as_predictor: false

w8_temporal:
  protocol_version: "1.0"
  descriptive_response_pca_components: 5
  descriptive_response_pca_variable_genes: 5000
  fixed_transfer:
    training_source: strict_94_time_matched_24h
    external_depmap_ids_only: true
    control_dimension: 20
    response_rank: 20
    ridge_alpha: 100.0
    variable_genes: 5000
    min_mean_log1p_cpm: 0.1
  bootstrap_replicates: 2000
  bootstrap_seed: 20260827
  target_genes: all_32738
  temporal_response_used_for_fit: false

w9_biology:
  protocol_version: "1.0"
  status: interpretation_only_no_model_selection
  response_pca_components: 5
  response_pca_variable_genes: 5000
  association_bootstrap_replicates: 2000
  permutation_replicates: 10000
  multiple_testing: benjamini_hochberg_all_reported_associations
  prediction_case_model: B4
  high_error_quantile: 0.75
  low_cell_quantile: 0.25
  sensitivity_as_predictor: false

compute:
  device: cpu
  max_workers: 12
