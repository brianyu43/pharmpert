[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yakseopdong"
version = "0.1.0"
description = "Held-out cell-line prediction of trametinib transcriptional responses"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "anndata>=0.12,<0.13",
  "h5py>=3.12,<4",
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pertpy>=1.0,<2",
  "pyarrow>=18,<24",
  "pyyaml>=6.0,<7",
  "rdata>=0.11,<1",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
]

[project.scripts]
yakseopdong = "yakseopdong.__main__:main"

[dependency-groups]
dev = [
  "jupyterlab>=4.3,<5",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yakseopdong"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
